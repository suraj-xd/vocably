[build]
builder = "nixpacks"

[build.nixpacks]
nixPkgs = ["bun"]
installCmd = "bun install"
buildCmd = "echo 'Skipping build - Bun runs TypeScript directly'"

[deploy]
startCommand = "bun run apps/server/src/index.ts"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
